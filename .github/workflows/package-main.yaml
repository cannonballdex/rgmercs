name: Publish to Github and Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'Cannonballdex/rgmercs'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n 's/.*version *= *\([0-9]\+\).*/\1/p' extras/version.lua)
          [ -z "$VERSION" ] && exit 1
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      # Create a file to upload
      - name: Create artifact
        run: |
          mkdir dist
          echo "Build from commit $GITHUB_SHA" > dist/info.txt
          zip -r dist/rgmercs.zip .

      # Create release + upload asset
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # cb- prefix: this fork still carries upstream's v1..v2949 tags, so plain vN reuses an old upstream commit.
          tag_name: cb-v${{ steps.version.outputs.version }}
          name: Release cb-v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/rgmercs.zip
